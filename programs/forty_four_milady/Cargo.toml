[package]
name = "forty_four_milady"
version = "0.2.0"
description = "44 Milady collateralized lending protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "forty_four_milady"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
  "anchor-lang/idl-build",
  "anchor-spl/idl-build",
]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = "=0.31.1"

# Anchor 0.31.1's SBF platform tools use an older Cargo/Rust toolchain.
# Pin crates that otherwise resolve to Edition-2024/MSRV-incompatible releases.
# These exact versions keep the Solana/Anchor dependency graph buildable by SBF.
blake3 = "=1.5.5"
constant_time_eq = "=0.3.1"
base64ct = "=1.7.3"
indexmap = "=2.11.4"
zeroize = "=1.8.1"
unicode-segmentation = "=1.12.0"
proc-macro-crate = "=3.2.0"
