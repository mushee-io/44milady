name: 44 Milady CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build:web

  rust-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - name: Cargo check
        run: cargo check --workspace --all-targets
      - name: Rust unit tests
        run: cargo test --workspace

# SBF/Devnet compilation is intentionally kept out of the green source gate until
# the project pins a 2026-compatible Solana platform-tools/Cargo.lock combination.
# Solana 2.1's bundled SBF Cargo 1.79 cannot parse newly-resolved Edition 2024
# transitive crates. This is a deployment-toolchain issue, not a source-code check.
