name: 44 Milady CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run release:check
      - run: npm test
      - run: npm run build:web

  rust-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --workspace --all-targets
      - name: Rust unit tests
        run: cargo test --workspace

  anchor-sbf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - name: Install Solana 2.1.0
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.0/install)"
      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install modern cargo-build-sbf
        run: cargo install cargo-build-sbf --version 4.1.0 --locked
      - name: Build SBF with platform-tools v1.57
        run: |
          PATH="$HOME/.cargo/bin:$PATH" cargo-build-sbf --version
          PATH="$HOME/.cargo/bin:$PATH" cargo-build-sbf --tools-version v1.57 --manifest-path programs/forty_four_milady/Cargo.toml
      - name: Install Anchor 0.31.1
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --force
          avm install 0.31.1
          avm use 0.31.1
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
      - name: Anchor SBF + IDL build
        run: PATH="$HOME/.cargo/bin:$HOME/.avm/bin:$PATH" anchor build
